name: Run DeFi Sentinel Agent

on:
  schedule:
    # Runs every 6 hours. Safe for your API limits.
    - cron: "0 */6 * * *"

  # This lets you run it manually from the "Actions" tab
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      # 1. Checks out your repo's code
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Sets up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. Installs Python libraries
      # Tells GitHub to work inside your Python folder
      - name: Install dependencies
        working-directory: ./DeFi-Sentinel
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Runs your agent!
      # Also tells GitHub to work inside your Python folder
      - name: Run Python Agent
        working-directory: ./DeFi-Sentinel
        run: python agent.py
        env:
          # Loads the secrets you added
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          PINATA_API_KEY: ${{ secrets.PINATA_API_KEY }}
          PINATA_API_SECRET: ${{ secrets.PINATA_API_SECRET }}
          ALCHEMY_API_URL: ${{ secrets.ALCHEMY_API_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          CONTRACT_ADDRESS: ${{ secrets.CONTRACT_ADDRESS }}
          MOCK_DEFI_ADDRESS: ${{ secrets.MOCK_DEFI_ADDRESS }}
